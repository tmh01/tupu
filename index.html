<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>多维文献全景图谱 </title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; font-family: sans-serif; color: #fff; overflow: hidden;}
        #chart-container { width: 100vw; height: 100vh; }
        .header { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(30,41,59,0.9); padding: 15px; border-radius: 8px; border: 1px solid #334155; pointer-events: none;}
        .header h2 { margin: 0 0 5px 0; font-size: 18px; color: #38bdf8; }
        .header p { margin: 0; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="status-text">正在加载...</h2>
        <p id="sub-text">实线箭头：引用继承 | 单条虚线：核心语义相关 | 节点大小：引用影响力</p>
    </div>
    <div id="chart-container"></div>

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var binId = urlParams.get('id');
        
        // 标题归一化：用于跨论文匹配
        function normalize(str) {
            return str ? str.toLowerCase().replace(/[^a-z0-9]/g, '') : '';
        }

        // 语义词组提取
        function getSemanticGrams(str) {
            let words = str.toLowerCase().split(/[^a-z]/).filter(w => w.length > 4);
            let grams = new Set(words); 
            for(let i=0; i<words.length-1; i++) grams.add(words[i] + " " + words[i+1]);
            return grams;
        }

        if (binId) {
            fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                headers: { 'X-Access-Key': '$2a$10$R0V/CvN8JQs5HQK.9QakeeA6Odkw.nwpMzIyyUQ.cNJH34Lk.SW0q' }
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('status-text').innerText = '学术文献全景关联图谱';
                renderGraph(data.record); 
            })
            .catch(err => { document.getElementById('status-text').innerText = '数据加载失败'; });
        }

        function renderGraph(papers) {
            let nodes = [], links = [], nodeNames = new Set();
            
            // 1. 初始化节点数据
            papers.forEach(p => {
                let shortTitle = p.title.length > 40 ? p.title.substring(0, 40) + "..." : p.title;
                if (!nodeNames.has(shortTitle)) {
                    let venueInfo = p.venue || (p.venues_list && p.venues_list.length > 0 ? p.venues_list[0] : '未知期刊/会议');
                    nodes.push({
                        name: shortTitle, 
                        value: p.citationCount || 0, 
                        year: p.year || '未知',
                        venue: venueInfo,
                        rawTitle: p.title,
                        normTitle: normalize(p.title),
                        refs: (p.ref_norm_titles || []).map(r => normalize(r)),
                        grams: getSemanticGrams(p.title)
                    });
                    nodeNames.add(shortTitle);
                }
            });

            // 2. 核心关联算法：引用优先 + 语义保底
            for (let i = 0; i < nodes.length; i++) {
                for (let j = 0; j < nodes.length; j++) {
                    if (i === j) continue;
                    let a = nodes[i], b = nodes[j];
                    
                    // --- A. 引用关系检测 (实线箭头) ---
                    // 采用模糊匹配逻辑：引文包含标题或标题包含引文
                    let isCited = a.refs.some(r => r.length > 10 && (r.includes(b.normTitle) || b.normTitle.includes(r)));
                    
                    if (isCited) {
                        links.push({
                            source: a.name, target: b.name,
                            symbol: ['none', 'arrow'],
                            symbolSize: [0, 10],
                            lineStyle: { type: 'solid', width: 2.5, color: '#38bdf8', opacity: 0.8 }
                        });
                    } 
                    // --- B. 语义相关性检测 (单条虚线) ---
                    // 仅在 i < j 时计算一次，且确保 A 和 B 之间没有任何方向的引用关系
                    else if (i < j) {
                        let isReverseCited = b.refs.some(r => r.length > 10 && (r.includes(a.normTitle) || a.normTitle.includes(r)));
                        
                        if (!isReverseCited) {
                            let intersect = new Set([...a.grams].filter(x => b.grams.has(x)));
                            let jaccard = intersect.size / (a.grams.size + b.grams.size - intersect.size);
                            
                            // 语义相关门槛设为 0.25
                            if (jaccard > 0.25) {
                                links.push({
                                    source: a.name, target: b.name,
                                    symbol: ['none', 'none'],
                                    lineStyle: { type: 'dashed', width: 1.2, color: '#94a3b8', opacity: 0.4 }
                                });
                            }
                        }
                    }
                }
            }

            var chart = echarts.init(document.getElementById('chart-container'));
            chart.setOption({
                tooltip: { 
                    backgroundColor: 'rgba(15, 23, 42, 0.95)',
                    borderColor: '#38bdf8',
                    textStyle: { color: '#fff' },
                    formatter: function(p) {
                        if (p.dataType === 'node') {
                            return `<div style="max-width:320px; white-space:normal; word-break:break-all;">
                                        <b style="color:#38bdf8; font-size:14px;">${p.data.rawTitle}</b><br/>
                                        <hr style="border:0; border-top:1px solid #334155; margin:8px 0;">
                                        <b>发表期刊:</b> ${p.data.venue}<br/>
                                        <b>发表年份:</b> ${p.data.year}<br/>
                                        <b>全球被引:</b> ${p.data.value} 次
                                    </div>`;
                        }
                        return `关联路径: ${p.data.source} > ${p.data.target}`;
                    }
                },
                series: [{
                    type: 'graph', 
                    layout: 'force', 
                    roam: true, 
                    draggable: true,
                    autoCurveness: true, // 开启自动曲率，处理互引情况
                    symbolSize: (val) => Math.max(15, Math.min(val / 8 + 12, 60)),
                    itemStyle: { color: '#38bdf8', borderColor: '#fff', borderWidth: 1, shadowBlur: 15, shadowColor: '#38bdf8' },
                    label: { show: true, position: 'right', fontSize: 10, color: '#e2e8f0' },
                    force: { repulsion: 1000, edgeLength: 200, gravity: 0.1 },
                    data: nodes, 
                    links: links
                }]
            });
        }
    </script>
</body>
</html>
